interface:
  display_name: "Agent Workspace Checkpoint"
  short_description: "Create private or public Relay checkpoints"
  default_prompt: "Use $agent-workspace-checkpoint to ask whether this checkpoint should remain private or become intentionally public. Keep private as the default. For private mode, offer a user-chosen passphrase as the recommended default or an explicitly requested generated recovery key that is displayed once in your response and never saved to a file. Public mode requires an approved title and description and no decryption secret; private-to-public publication must decrypt and sanitize locally without ever sending the secret to Relay."
